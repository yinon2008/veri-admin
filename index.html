<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VERI · Admin</title>
<style>
  :root { --bg:#000; --card:#111; --line:rgba(255,255,255,.10); --ink:#fff; --dim:#8c8c8c; --green:#30d158; --red:#ff453a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; min-height:100vh; }
  .wrap { max-width:920px; margin:0 auto; padding:32px 20px 80px; }
  h1 { font-size:22px; letter-spacing:6px; font-weight:700; text-align:center; margin-bottom:4px; }
  .sub { text-align:center; color:var(--dim); font-size:12px; letter-spacing:2px; text-transform:uppercase; margin-bottom:28px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; margin-bottom:16px; }
  label { display:block; font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; margin:10px 0 6px; }
  input, select { width:100%; height:44px; background:#0a0a0a; border:1px solid var(--line); border-radius:10px; color:var(--ink); padding:0 12px; font-size:15px; }
  button { height:44px; border:none; border-radius:10px; background:#fff; color:#000; font-weight:700; font-size:14px; cursor:pointer; padding:0 18px; }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); }
  button.danger { background:transparent; color:var(--red); border:1px solid rgba(255,69,58,.4); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .hidden { display:none !important; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--dim); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:1px; }
  .pill { font-size:11px; padding:3px 10px; border-radius:999px; border:1px solid var(--line); }
  .pill.on { color:var(--green); border-color:rgba(48,209,88,.4); }
  .pill.off { color:var(--dim); }
  .msg { font-size:13px; padding:10px 12px; border-radius:10px; margin-bottom:12px; }
  .msg.err { background:rgba(255,69,58,.12); color:var(--red); }
  .msg.ok  { background:rgba(48,209,88,.12); color:var(--green); }
  .email { font-weight:500; }
  .muted { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>V E R I</h1>
  <div class="sub">Admin Console</div>
  <div id="msg"></div>

  <!-- Login -->
  <div id="login" class="card">
    <label>Admin email</label>
    <input id="email" type="email" autocomplete="username" />
    <label>Password</label>
    <input id="password" type="password" autocomplete="current-password" />
    <div class="row" style="margin-top:16px;">
      <button id="loginBtn">Sign in</button>
      <span class="muted">Admin accounts only.</span>
    </div>
  </div>

  <!-- Console -->
  <div id="console" class="hidden">
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <div><span class="muted">Signed in as</span> <span id="whoami" class="email"></span></div>
        <button class="ghost" id="logoutBtn">Sign out</button>
      </div>
      <div class="row" style="margin-top:14px; align-items:flex-end;">
        <div style="flex:1; min-width:180px;"><label>Set new password (for my account)</label><input id="newPw" type="password" autocomplete="new-password" /></div>
        <button class="ghost" id="setPwBtn">Update password</button>
      </div>
    </div>

    <div class="card">
      <strong>Create user</strong>
      <div class="row" style="margin-top:12px; align-items:flex-end;">
        <div style="flex:1; min-width:180px;"><label>Email</label><input id="newEmail" type="email" /></div>
        <div style="flex:1; min-width:160px;"><label>Password (≥ 8)</label><input id="newPass" type="text" /></div>
        <button id="createBtn">Create</button>
      </div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between; margin-bottom:8px;">
        <strong>Users &amp; access</strong>
        <button class="ghost" id="refreshBtn">Refresh</button>
      </div>
      <div style="overflow-x:auto;">
        <table>
          <thead><tr><th>Email</th><th>Access</th><th>Grant tier</th><th></th></tr></thead>
          <tbody id="users"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

// ─── CONFIG — public values only (anon key is safe to expose; RLS protects data) ───
const SUPABASE_URL = "https://hphhaqfvxgqvensjjunf.supabase.co";
const ANON_KEY     = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhwaGhhcWZ2eGdxdmVuc2pqdW5mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNTkxOTEsImV4cCI6MjA5NTYzNTE5MX0.8eKxo6mWjAlRrrHknPFZzyFdEzjs3VPCDphxssfXbsI";
const FUNCTION_URL = `${SUPABASE_URL}/functions/v1/admin-api`;

const sb = createClient(SUPABASE_URL, ANON_KEY);
const $ = (id) => document.getElementById(id);
const show = (el, on) => el.classList.toggle("hidden", !on);

function flash(text, kind = "ok") {
  const m = $("msg");
  m.innerHTML = `<div class="msg ${kind}">${text}</div>`;
  if (kind === "ok") setTimeout(() => (m.innerHTML = ""), 3500);
}

// Call the Edge Function with the admin's session token (never the service key).
async function api(action, body = {}) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error("Not signed in");
  const res = await fetch(FUNCTION_URL, {
    method: "POST",
    headers: { "content-type": "application/json", authorization: `Bearer ${session.access_token}` },
    body: JSON.stringify({ action, ...body }),
  });
  const out = await res.json();
  if (!res.ok) throw new Error(out.error || "Request failed");
  return out;
}

async function refresh() {
  try {
    const { users } = await api("list_users");
    $("users").innerHTML = users.map((u) => {
      const g = u.grant;
      const active = g && g.active && (!g.expires_at || new Date(g.expires_at) > new Date());
      return `<tr>
        <td class="email">${u.email ?? "—"}<div class="muted">${u.id.slice(0, 8)}…</div></td>
        <td><span class="pill ${active ? "on" : "off"}">${active ? "GRANTED · " + g.tier : "none"}</span></td>
        <td>
          <select data-user="${u.id}" class="tier">
            <option value="full">full</option>
            <option value="enthusiast">enthusiast</option>
            <option value="commercial">commercial</option>
          </select>
        </td>
        <td class="row">
          <button data-grant="${u.id}">Grant</button>
          <button class="danger" data-revoke="${u.id}">Revoke</button>
        </td>
      </tr>`;
    }).join("");

    document.querySelectorAll("[data-grant]").forEach((b) => b.onclick = async () => {
      const id = b.dataset.grant;
      const tier = document.querySelector(`.tier[data-user="${id}"]`).value;
      try { await api("grant_access", { user_id: id, tier }); flash("Access granted"); refresh(); }
      catch (e) { flash(e.message, "err"); }
    });
    document.querySelectorAll("[data-revoke]").forEach((b) => b.onclick = async () => {
      try { await api("revoke_access", { user_id: b.dataset.revoke }); flash("Access revoked"); refresh(); }
      catch (e) { flash(e.message, "err"); }
    });
  } catch (e) { flash(e.message, "err"); }
}

async function renderAuth() {
  const { data: { session } } = await sb.auth.getSession();
  show($("login"), !session);
  show($("console"), !!session);
  if (session) { $("whoami").textContent = session.user.email; refresh(); }
}

$("loginBtn").onclick = async () => {
  try {
    const { error } = await sb.auth.signInWithPassword({ email: $("email").value.trim(), password: $("password").value });
    if (error) throw error;
    renderAuth();
  } catch (e) { flash(e.message, "err"); }
};
$("logoutBtn").onclick = async () => { await sb.auth.signOut(); renderAuth(); };
$("setPwBtn").onclick = async () => {
  try {
    const pw = $("newPw").value;
    if (pw.length < 8) throw new Error("Password must be at least 8 characters");
    const { error } = await sb.auth.updateUser({ password: pw });
    if (error) throw error;
    $("newPw").value = "";
    flash("Password updated — use it for future sign-ins");
  } catch (e) { flash(e.message, "err"); }
};
$("refreshBtn").onclick = refresh;
$("createBtn").onclick = async () => {
  try {
    await api("create_user", { email: $("newEmail").value.trim(), password: $("newPass").value });
    flash("User created"); $("newEmail").value = ""; $("newPass").value = ""; refresh();
  } catch (e) { flash(e.message, "err"); }
};

renderAuth();
</script>
</body>
</html>
